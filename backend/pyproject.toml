[project]
name = "taskforge-backend"
version = "0.1.0"
description = "TaskForge - Intelligent Asynchronous Job Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "elasticsearch>=8.15.0",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0"
]
ai = [
    "crewai>=0.80.0",
    "langchain>=0.3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*:",
    "ignore::DeprecationWarning:slowapi.*:"
]
